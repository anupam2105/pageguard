route:
  receiver: pageguard
  group_by: [alertname, service, environment]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: pageguard
    webhook_configs:
      - url: http://pageguard:8080/webhooks/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials: demo-token
