global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: checkout
    honor_labels: true
    static_configs:
      - targets: ["checkout:8080"]
  - job_name: pageguard
    static_configs:
      - targets: ["pageguard:8080"]
