{{- if and .Values.runbooks.files (not .Values.runbooks.existingConfigMap) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pageguard.fullname" . }}-runbooks
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pageguard.labels" . | nindent 4 }}
data:
  {{- toYaml .Values.runbooks.files | nindent 2 }}
{{- end }}
