apiVersion: v1
kind: Service
metadata:
  name: {{ include "pageguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pageguard.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.portName }}
      protocol: TCP
  selector:
    {{- include "pageguard.selectorLabels" . | nindent 4 }}
