apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pageguard.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pageguard.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.0
      command:
        - sh
        - -c
        - |
          set -e
          BASE="http://{{ include "pageguard.fullname" . }}:{{ .Values.service.port }}"
          curl -sf "$BASE/healthz" | grep -q '"status":"ok"'
          curl -sf "$BASE/readyz"  | grep -q '"status":"ready"'
          curl -sf "$BASE/metrics" | grep -q "pageguard_http_requests_total"
